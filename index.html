<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Astra AI</h1>
        <div class="model-selection">
            <label for="model">Choose a model:</label>
            <select id="model">
                <option value="astra-2.5">Astra 2.5</option>
                <option value="astra-3.0-pro">Astra 3.0 Pro</option>
            </select>
        </div>
        <div class="avatar">
            <img src="src/avatar.png" alt="User Avatar">
        </div>
        <div class="spinner">
            <img src="src/spinner.svg" alt="Loading Spinner">
        </div>
    </header>
    <main>
        <p>This is the redesigned Astra AI interface.</p>
    </main>
    <footer>
        <p>&copy; 2026 Astra AI. All rights reserved.</p>
    </footer>
</body>
</html>
